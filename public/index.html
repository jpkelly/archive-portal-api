<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archive Portal</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Email Archive Portal</h1>
          <p class="sub">Read-only archive browsing</p>
        </div>
        <div class="user-controls">
          <span id="currentUser" class="muted"></span>
          <button id="logoutBtn" class="button ghost hidden" type="button">Log out</button>
        </div>
      </header>

      <section id="loginCard" class="card">
        <h2>Sign in</h2>
        <form id="loginForm" class="form" autocomplete="off">
          <label>
            Email
            <input id="email" name="email" type="email" required />
          </label>
          <label>
            Password
            <input id="password" name="password" type="password" required />
          </label>
          <button class="button" type="submit">Sign in</button>
        </form>
      </section>

      <section id="portal" class="portal hidden">
        <aside class="panel">
          <h3>Domains</h3>
          <ul id="domainList" class="list"></ul>
        </aside>

        <aside class="panel">
          <h3>Accounts</h3>
          <ul id="accountList" class="list"></ul>
        </aside>

        <aside class="panel">
          <h3>Folders</h3>
          <ul id="folderList" class="list"></ul>
        </aside>

        <section class="panel wide">
          <div class="messages-header">
            <h3>Messages</h3>
            <div class="messages-tools">
              <input id="messageSearch" type="text" placeholder="Filter subject or sender..." />
              <label class="inline-filter">
                From
                <input id="messageDateFrom" type="date" />
              </label>
              <label class="inline-filter">
                To
                <input id="messageDateTo" type="date" />
              </label>
              <button id="messageSearchBtn" class="button ghost" type="button">Search</button>
              <button id="messageResetBtn" class="button ghost" type="button">Reset</button>
              <button id="messagePrevBtn" class="button ghost" type="button">Prev</button>
              <button id="messageNextBtn" class="button ghost" type="button">Next</button>
            </div>
          </div>
          <p id="messagePageInfo" class="muted page-info">No folder selected.</p>
          <ul id="messageList" class="list"></ul>
        </section>

        <section class="panel wide">
          <div class="detail-header">
            <h3>Message Detail</h3>
            <div id="viewToggle" class="view-toggle hidden">
              <button id="togglePlain" class="toggle-btn active" type="button">Plain Text</button>
              <button id="toggleEmail" class="toggle-btn" type="button">Email View</button>
            </div>
          </div>
          <article id="messageDetail" class="detail muted">Select a message to view details.</article>
          <div id="messageDetailEmail" class="email-view hidden"></div>
        </section>
      </section>

      <p id="status" class="status"></p>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
